[package]
name = "nas_indexer"
version = "0.1.0"
edition = "2021"

[lib]
name = "nas_indexer_core"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "nas_indexer"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
unicode-normalization = "0.1.26"
