[package]
name = "nas_hasher"
version = "0.1.0"
edition = "2021"

[lib]
name = "nas_hasher_core"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "nas_hasher"
path = "src/main.rs"

[dependencies]
sha2 = "0.10"
md-5 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
