[package]
name = "nas_hasher"
version = "0.1.0"
edition = "2021"

[lib]
name = "nas_hasher_core"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "nas_hasher"
path = "src/main.rs"

[dependencies]
sha2 = "0.10"
md-5 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
rayon = "1.12.0"
walkdir = "2.5.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "bmp", "gif"] }
fast_image_resize = "=6.1.0"
kamadak-exif = "0.6.2"
zip = { version = "2.2.2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
