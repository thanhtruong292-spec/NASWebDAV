name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Hủy run cũ khi push mới trên cùng ref
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-server-tests:
    name: Python server tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        if: hashFiles('nas_api_server.py') != ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        if: hashFiles('nas_api_server.py') != ''
        run: python -m pip install --upgrade pip pytest

      - name: Syntax check nas_api_server.py
        if: hashFiles('nas_api_server.py') != ''
        run: python -m py_compile nas_api_server.py

      - name: Verify Python 3.5 compatibility (No f-strings/walrus/ann-assign)
        if: hashFiles('nas_api_server.py') != ''
        run: |
          python -c "
          import ast
          class Py35Checker(ast.NodeVisitor):
              def __init__(self): self.errors = []
              def visit_JoinedStr(self, node): self.errors.append('Line %d: f-string used (Python 3.6+)' % node.lineno); self.generic_visit(node)
              def visit_NamedExpr(self, node): self.errors.append('Line %d: walrus operator used (Python 3.8+)' % node.lineno); self.generic_visit(node)
              def visit_AnnAssign(self, node): self.errors.append('Line %d: type annotation used (Python 3.6+)' % node.lineno); self.generic_visit(node)
          tree = ast.parse(open('nas_api_server.py', 'r', encoding='utf-8').read())
          checker = Py35Checker()
          checker.visit(tree)
          if checker.errors:
              for err in checker.errors: print('SYNTAX ERROR:', err)
              exit(1)
          print('Python 3.5 compatibility check PASSED')
          "

      - name: Run server unit tests
        if: hashFiles('nas_api_server.py') != ''
        run: python -m pytest -q

      - name: Skip server tests
        if: hashFiles('nas_api_server.py') == ''
        run: echo "nas_api_server.py is not present in this checkout; skipping server tests."

  unit-tests:
    name: Unit tests + Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run JVM unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Run Android Lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
