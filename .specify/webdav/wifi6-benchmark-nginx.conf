user www-data;
worker_processes 1;
pid /tmp/nas-wifi6-benchmark/nginx.pid;
error_log /tmp/nas-wifi6-benchmark/error.log warn;
events { worker_connections 128; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format bench '$msec $request_method $status $request_length $bytes_sent $request_time $upstream_response_time';
    access_log /tmp/nas-wifi6-benchmark/access.log bench;
    sendfile on;
    client_body_temp_path /tmp/nas-wifi6-benchmark/body;
    fastcgi_temp_path /tmp/nas-wifi6-benchmark/fastcgi;
    fastcgi_request_buffering off;
    server {
        listen 192.168.100.254:18822;
        server_name _;
        allow 192.168.100.19;
        allow 127.0.0.1;
        deny all;
        location / { return 404; }
        location /webdav {
            alias /var/www/webdav/public;
            client_max_body_size 1048576M;
            index index.php;
            dav_methods off;
            rewrite ^/webdav/(.*)$ /webdav/index.php last;
            location ~ \.php$ {
                include /etc/nginx/fastcgi.conf;
                fastcgi_param SCRIPT_FILENAME $request_filename;
                fastcgi_pass unix:/var/run/php-fpm-openmediavault-webdav.sock;
            }
            location = /webdav/favicon.ico { access_log off; log_not_found off; }
        }
    }
}
